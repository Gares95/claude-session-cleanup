[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-cleanup"
version = "0.1.0"
description = "Read-only inspection and retention planning for local Claude Code sessions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.scripts]
claude-session-cleanup = "claude_session_cleanup.cli:main"

[tool.setuptools]
packages = ["claude_session_cleanup"]
