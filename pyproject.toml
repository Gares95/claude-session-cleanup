[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-cleanup"
version = "1.0.0"
description = "Retention previews and reviewed permanent deletion for local Claude Code sessions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/Gares95/claude-session-cleanup"
Issues = "https://github.com/Gares95/claude-session-cleanup/issues"

[project.scripts]
claude-session-cleanup = "claude_session_cleanup.cli:main"

[tool.setuptools]
packages = ["claude_session_cleanup"]
